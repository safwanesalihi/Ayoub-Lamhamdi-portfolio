name = "productive-day"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/telegram/*"]

[[d1_databases]]
binding = "DB"
database_name = "productive-day"
# Replace with the id printed by `npx wrangler d1 create productive-day`
database_id = "00000000-0000-0000-0000-000000000000"

# Reminders: every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Your bot's username without the @, e.g. "ProductiveDayBot"
TELEGRAM_BOT_USERNAME = ""

[observability]
enabled = true
